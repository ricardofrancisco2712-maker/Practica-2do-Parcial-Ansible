---
- name: Administrar servidores Docker con Ansible
  hosts: docker
  gather_facts: true

  tasks:
    - name: Mostrar el nombre del host
      ansible.builtin.debug:
        msg: "Nombre del host: {{ ansible_hostname }} (inventario: {{ inventory_hostname }})"

    - name: Mostrar el sistema operativo
      ansible.builtin.debug:
        msg: "Sistema operativo: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Crear el directorio /tmp/ansible-demo
      ansible.builtin.file:
        path: /tmp/ansible-demo
        state: directory
        mode: "0755"

    - name: Crear el archivo info.txt con el nombre del servidor y el sistema operativo
      ansible.builtin.copy:
        dest: /tmp/ansible-demo/info.txt
        content: |
          Servidor: {{ ansible_hostname }}
          Sistema operativo: {{ ansible_distribution }} {{ ansible_distribution_version }}
        mode: "0644"

    - name: Crear directorios con un loop
      ansible.builtin.file:
        path: "/tmp/ansible-demo/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - logs
        - backup
        - config

    - name: Mostrar mensaje solo si el sistema operativo es Ubuntu
      ansible.builtin.debug:
        msg: "Este servidor ({{ inventory_hostname }}) ejecuta Ubuntu."
      when: ansible_distribution == "Ubuntu"